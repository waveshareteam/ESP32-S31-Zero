name: ESP32-S31 firmware (experimental)
on:
  push:
    branches: [main]
    paths:
      - 'examples/esp-idf/**'
      - '!examples/esp-idf/**/*.md'
      - 'config/**'
      - 'scripts/**'
      - 'releases/*.py'
      - 'tests/**'
      - '.github/workflows/firmware.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'examples/esp-idf/**'
      - '!examples/esp-idf/**/*.md'
      - 'config/**'
      - 'scripts/**'
      - 'releases/*.py'
      - 'tests/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      example:
        description: all, example name, or repository-relative path
        type: string
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_repo.py
      - id: matrix
        env:
          SELECTOR: ${{ github.ref_type == 'tag' && 'all' || inputs.example || 'all' }}
        run: |
          python3 scripts/discover_examples.py "$SELECTOR" --matrix > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
  build:
    name: ${{ matrix.version }} / ${{ matrix.name }} / experimental=${{ matrix.experimental }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: espressif/esp-idf
          ref: ${{ matrix.commit }}
          path: .ci/esp-idf
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned IDF toolchain
        env:
          IDF_TOOLS_PATH: ${{ runner.temp }}/idf-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          .ci/esp-idf/install.sh esp32s31
      - name: Build firmware
        env:
          IDF_TOOLS_PATH: ${{ runner.temp }}/idf-tools
          EXAMPLE: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          COMPONENT_MANAGER: ${{ matrix.component_manager }}
        shell: bash
        run: |
          source .ci/esp-idf/export.sh
          python -m pip install "idf-component-manager==$COMPONENT_MANAGER"
          set -o pipefail
          python scripts/build_example.py "$EXAMPLE" --version "$VERSION" 2>&1 | tee "$RUNNER_TEMP/firmware-build.log"
      - name: Package and validate firmware
        env:
          IDF_TOOLS_PATH: ${{ runner.temp }}/idf-tools
          EXAMPLE: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          source .ci/esp-idf/export.sh
          python releases/package_firmware.py --example "$EXAMPLE" --version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ matrix.name }}-${{ matrix.version }}
          path: releases/dist/*.zip
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.name }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/firmware-build.log
            examples/esp-idf/${{ matrix.name }}/build/log/
            examples/esp-idf/${{ matrix.name }}/build/CMakeFiles/CMakeConfigureLog.yaml
            examples/esp-idf/${{ matrix.name }}/dependencies.lock
          retention-days: 7
  validate-artifacts:
    name: Validate firmware artifact set
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: firmware-*
          path: release-artifacts
      - name: Validate selected matrix against this checkout
        env:
          SELECTOR: ${{ github.ref_type == 'tag' && 'all' || inputs.example || 'all' }}
        run: python3 releases/validate_release.py release-artifacts --commit "$GITHUB_SHA" --example "$SELECTOR"
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build, validate-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: firmware-*
          path: release-artifacts
      - name: Validate complete set and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/publish_release.py
