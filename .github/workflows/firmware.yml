name: ESP32-S31 firmware (experimental)
on:
  push:
    branches: ['**']
    paths:
      - 'examples/esp-idf/**'
      - '!examples/esp-idf/**/*.md'
      - 'config/**'
      - 'scripts/**'
      - 'releases/*.py'
      - 'tests/**'
      - '.github/workflows/firmware.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'examples/esp-idf/**'
      - '!examples/esp-idf/**/*.md'
      - 'config/**'
      - 'scripts/**'
      - 'releases/*.py'
      - 'tests/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      example:
        description: all, example name, or repository-relative path
        type: string
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_repo.py
      - id: matrix
        env:
          SELECTOR: ${{ github.ref_type == 'tag' && 'all' || inputs.example || 'all' }}
        run: |
          python3 scripts/discover_examples.py "$SELECTOR" --matrix > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
  build:
    name: ${{ matrix.version }} / ${{ matrix.name }} / experimental=${{ matrix.experimental }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: espressif/esp-idf
          ref: ${{ matrix.commit }}
          path: .ci/esp-idf
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned IDF toolchain
        env:
          IDF_TOOLS_PATH: ${{ runner.temp }}/idf-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0
          .ci/esp-idf/install.sh esp32s31
      - name: Build and package
        env:
          IDF_TOOLS_PATH: ${{ runner.temp }}/idf-tools
          EXAMPLE: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          COMPONENT_MANAGER: ${{ matrix.component_manager }}
        shell: bash
        run: |
          source .ci/esp-idf/export.sh
          python -m pip install "idf-component-manager==$COMPONENT_MANAGER"
          python scripts/build_example.py "$EXAMPLE" --version "$VERSION"
          python releases/package_firmware.py --example "$EXAMPLE" --version "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.name }}-${{ matrix.version }}
          path: releases/dist/*.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: firmware-*
          path: release-artifacts
      - name: Validate complete set and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 releases/publish_release.py
